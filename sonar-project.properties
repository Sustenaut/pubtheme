# Read by the CI scan (pubkit's sonar job). tools/ holds scripts a developer
# runs by hand to make test data; their arguments and inputs are the
# developer's own, so taint findings there are not reachable by anyone else.
sonar.exclusions=tools/**
# lib/ and themes/ are JavaScript the functional suite runs as a program, from Python, so no coverage of them
# reaches the scan: every change there would read as 0%. They are still scanned for everything else.
sonar.coverage.exclusions=lib/**,themes/**
