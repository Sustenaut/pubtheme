name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  ci:
    uses: Sustenaut/pubkit/.github/workflows/python-ci.yml@44056227327a7af7f344e008fb72106b2eae4eca # v0.16.0
    with:
      setup: make venv node
    # By name: secrets: inherit reaches no workflow of another owner.
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The shared release workflow: on a pull request, a code change records
  # what it changes with `pubrel add`, and a release is the bump those rows
  # require, published; on main, a published version is tagged and
  # released. CI signs nothing; the release was signed when the package
  # publet was published.
  release:
    needs: ci
    uses: Sustenaut/pubrel/.github/workflows/release.yml@16c6c9731b3f41639d45160e8bb73d59d8562e04 # v0.5.5
    with: { pubrel-version: v0.5.5 }
    permissions:
      contents: write
